<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HavenX — Ticket Setup</title>
  <link rel="stylesheet" href="./styles.css" type="text/css" />
</head>

<body>
  <div class="hero flow-hero">
    <nav>
      <div class="head">
        <img src="./assets/logo.png" alt="Logo design" />
        <div class="name">
          <h2>HAVEN<span>X</span></h2>
          <h5>Creating Events that Inspire</h5>
        </div>
      </div>
      <div class="bar">
        <img src="./assets/fluent--navigation-24-filled_gold.svg" alt="Nav. bar" width="30px" />
      </div>
    </nav>
  </div>

  <main class="flow-main">
    <h1 class="flow-title">Set up your tickets</h1>
    <p class="flow-subtitle">Choose how attendees will get in.</p>

    <div class="progress-steps" aria-hidden="true">
      <div class="step completed">
        <span class="step-circle">1</span>
        <span class="step-label">Details</span>
      </div>
      <div class="step-line completed"></div>
      <div class="step completed">
        <span class="step-circle">2</span>
        <span class="step-label">Date &amp; Venue</span>
      </div>
      <div class="step-line completed"></div>
      <div class="step completed">
        <span class="step-circle">3</span>
        <span class="step-label">Banner</span>
      </div>
      <div class="step-line completed"></div>
      <div class="step active">
        <span class="step-circle">4</span>
        <span class="step-label">Tickets</span>
      </div>
    </div>
    <p class="step-caption">Step 4 of 4</p>

    <form id="ticketsForm" novalidate>
      <div class="ticket-type-options">
        <div class="ticket-type-card" data-type="free">
          <p>Free Event</p>
        </div>
        <div class="ticket-type-card" data-type="paid">
          <p>Paid Event</p>
        </div>
      </div>

      <div class="field">
        <label for="ticketName">Ticket Name (optional)</label>
        <input type="text" id="ticketName" name="ticketName" placeholder="General Admission" />
      </div>

      <div id="paidFields" class="paid-fields">
        <div class="field">
          <label for="ticketPrice">Ticket Price (₦)</label>
          <input type="number" id="ticketPrice" name="ticketPrice" min="0" step="1" placeholder="5000" />
          <span class="field-error"></span>
        </div>
      </div>

      <div class="field">
        <label for="ticketQuantity">Number of Available Tickets</label>
        <input type="number" id="ticketQuantity" name="ticketQuantity" min="0" step="1" placeholder="500" />
        <span class="field-error"></span>
      </div>

      <div class="btn-row">
        <a href="event-banner.html" class="btn btn-outline">Back</a>
        <button type="submit" class="btn btn-primary">Review Event</button>
      </div>
    </form>
  </main>

  <script src="./create-event.js"></script>
</body>

</html>
